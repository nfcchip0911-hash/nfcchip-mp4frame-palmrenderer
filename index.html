<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NFC WebAR Palm Player</title>
  <link rel="icon" type="image/svg+xml" href="/brand/logo.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <!-- Khung ứng dụng chính -->
  <div id="app-container">
    
    <!-- Video luồng Camera sau của điện thoại -->
    <video id="camera-stream" autoplay playsinline muted></video>

    <!-- Canvas vẽ video WebAR neo vào lòng bàn tay -->
    <canvas id="ar-canvas"></canvas>

    <!-- Video nguồn MP4 (ẩn làm texture phát vào lòng bàn tay) -->
    <video id="source-video" playsinline webkit-playsinline crossorigin="anonymous" preload="auto" style="display: none;"></video>

    <!-- Chỉ dẫn quét tinh tế (ẩn khi đã thấy bàn tay) -->
    <div id="scan-hint" class="scan-hint">
      <span class="pulse-dot"></span>
      <span>Ngửa lòng bàn tay trước camera</span>
    </div>

    <!-- Màn hình Khởi tạo (Splash Screen) -->
    <div id="splash-screen" class="splash-overlay">
      <div class="splash-top">
        <div class="brand-logo-container">
          <img src="/brand/logo.svg" alt="Logo Thương Hiệu" id="brand-logo">
        </div>
        <h1 class="project-title" id="card-title">Trải Nghiệm WebAR</h1>
        <p class="project-subtitle">Chạm thẻ & Khám phá khoảnh khắc kỳ diệu</p>
      </div>

      <div class="splash-center">
        <button id="btn-start" class="btn-start-ar">
          <span>Chạm để Bắt đầu</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </button>
      </div>

      <div class="splash-bottom">
        <p>Xử lý AI cục bộ trên thiết bị • Không lưu hình ảnh</p>
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
